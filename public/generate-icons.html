<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TallyUp Icon Generator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 {
      color: #333;
    }
    .canvas-container {
      margin: 20px 0;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    canvas {
      border: 1px solid #ddd;
      margin: 10px 0;
      display: block;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    button:hover {
      background: #5568d3;
    }
    .info {
      background: #e3f2fd;
      padding: 15px;
      border-radius: 6px;
      margin: 20px 0;
      border-left: 4px solid #2196f3;
    }
  </style>
</head>
<body>
  <h1>🎨 TallyUp PWA Icon Generator</h1>
  
  <div class="info">
    <strong>Instructions:</strong>
    <ol>
      <li>Click "Generate Icons" below</li>
      <li>Right-click each canvas and "Save image as..."</li>
      <li>Save to <code>/public/icons/</code> with the exact names shown</li>
    </ol>
  </div>

  <button onclick="generateAllIcons()" style="font-size: 18px; padding: 15px 30px;">
    ⚡ Generate All Icons
  </button>

  <div id="icons"></div>

  <script>
    function drawIcon(ctx, size) {
      const padding = size * 0.15;
      const contentSize = size - (padding * 2);
      
      // Gradient background
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#667eea');
      gradient.addColorStop(1, '#764ba2');
      ctx.fillStyle = gradient;
      
      // Rounded rectangle background
      const radius = size * 0.234; // 120/512 for 512px canvas
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fill();
      
      // Tally marks
      ctx.fillStyle = 'white';
      const tallyWidth = size * 0.031; // 16/512
      const tallyHeight = size * 0.234; // 120/512
      const tallyGap = size * 0.055; // 28/512
      const startX = padding + (contentSize * 0.15);
      const startY = padding + (contentSize * 0.3);
      
      // First group of 4 vertical tallies
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.roundRect(startX + (i * tallyGap), startY, tallyWidth, tallyHeight, tallyWidth / 2);
        ctx.globalAlpha = 0.9;
        ctx.fill();
      }
      
      // Diagonal cross-through
      ctx.save();
      ctx.translate(startX + (tallyGap * 1.5), startY + tallyHeight / 2);
      ctx.rotate(-20 * Math.PI / 180);
      ctx.beginPath();
      ctx.roundRect(-tallyGap * 0.5, -size * 0.02, tallyGap * 2.5, size * 0.039, size * 0.02);
      ctx.globalAlpha = 0.95;
      ctx.fill();
      ctx.restore();
      
      // Second group of 3 vertical tallies
      const group2X = startX + (tallyGap * 5);
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.roundRect(group2X + (i * tallyGap), startY, tallyWidth, tallyHeight, tallyWidth / 2);
        ctx.globalAlpha = 0.8;
        ctx.fill();
      }
      
      // Upward arrow at bottom
      ctx.globalAlpha = 0.7;
      ctx.strokeStyle = 'white';
      ctx.lineWidth = size * 0.039;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      
      const arrowY = size - padding - (contentSize * 0.1);
      const arrowX = size / 2;
      const arrowSize = size * 0.039;
      
      // Vertical line
      ctx.beginPath();
      ctx.moveTo(arrowX, arrowY);
      ctx.lineTo(arrowX, arrowY + (arrowSize * 2.5));
      ctx.stroke();
      
      // Arrow head
      ctx.beginPath();
      ctx.moveTo(arrowX - arrowSize, arrowY + arrowSize);
      ctx.lineTo(arrowX, arrowY);
      ctx.lineTo(arrowX + arrowSize, arrowY + arrowSize);
      ctx.stroke();
      
      ctx.globalAlpha = 1;
    }

    function generateIcon(size, name, maskable = false) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      
      if (maskable) {
        // Maskable: 80% content, 10% padding each side
        const contentSize = size * 0.8;
        const padding = size * 0.1;
        
        // Create temporary canvas for content
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = size;
        tempCanvas.height = size;
        const tempCtx = tempCanvas.getContext('2d');
        
        drawIcon(tempCtx, size);
        
        // Draw scaled down on main canvas
        ctx.drawImage(tempCanvas, 0, 0, size, size, padding, padding, contentSize, contentSize);
      } else {
        // Standard: full size
        drawIcon(ctx, size);
      }
      
      const container = document.createElement('div');
      container.className = 'canvas-container';
      
      const title = document.createElement('h3');
      title.textContent = `${name} (${size}x${size}${maskable ? ', maskable' : ''})`;
      container.appendChild(title);
      
      container.appendChild(canvas);
      
      const downloadBtn = document.createElement('button');
      downloadBtn.textContent = `💾 Download ${name}`;
      downloadBtn.onclick = () => {
        const link = document.createElement('a');
        link.download = name;
        link.href = canvas.toDataURL('image/png');
        link.click();
      };
      container.appendChild(downloadBtn);
      
      document.getElementById('icons').appendChild(container);
    }

    function generateAllIcons() {
      document.getElementById('icons').innerHTML = '';
      generateIcon(192, 'icon-192.png', false);
      generateIcon(512, 'icon-512.png', false);
      generateIcon(192, 'icon-192-maskable.png', true);
      generateIcon(512, 'icon-512-maskable.png', true);
    }
  </script>
</body>
</html>
